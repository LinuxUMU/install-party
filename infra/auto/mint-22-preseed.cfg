d-i debian-installer/locale string es_ES.UTF-8
d-i debian-installer/language string es
d-i debian-installer/country string ES
d-i keyboard-configuration/layoutcode string es

d-i mirror/protocol string https
d-i mirror/country string manual
d-i mirror/http/hostname string install-party.local
d-i mirror/http/directory string /debian

d-i mirror/suite string trixie

d-i passwd/root-login boolean false

d-i clock-setup/utc boolean true
d-i time/zone string Europe/Madrid
d-i clock-setup/ntp boolean true

ubiquity partman-auto/method string regular

d-i partman-auto/choose_recipe              select atomic
d-i partman/default_filesystem              string ext4

ubiquity ubiquity/success_command string \
  in-target apt update;\
  in-target apt upgrade;\
  in-target apt install firefox libreoffice build-essential cmake gdb vim neovim geany git openjdk-21-jdk okteta texlive-full r-base octave maude qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils virt-manager libvirt-daemon-driver-lxc wireshark nmap socat arping tshark tcpdump bison flex python3-numpy python3-scipy;\
  in-target apt curl http://install-party.local/scripts/mint-22.sh | bash;
  
