       transform="translate(-8.9587114,29.729453)"><tspan
         x="173.8457"
         y="985.9238"
         id="tspan1">LinuxUMU</tspan></text><text
       xml:space="preserve"
       id="text2"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:48px;line-height:1.25;font-family:Monospace;-inkscape-font-specification:Monospace;white-space:pre;shape-inside:url(#rect3);display:inline;fill:#f8f8f8;fill-opacity:1"
       transform="translate(-76.181723,-20.438999)"><tspan
         x="696.34961"
         y="991.08203"
         id="tspan2">https://linuxumu.github.io/web/
</tspan><tspan
         x="696.34961"
         y="1051.082"
         id="tspan5">t.me/linuxumu</tspan></text><text
       xml:space="preserve"
       id="text3"
       style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:85.3333px;line-height:1.25;font-family:Monospace;-inkscape-font-specification:'Monospace Bold';white-space:pre;shape-inside:url(#rect4);display:inline;fill:#f8f8f8;fill-opacity:1"
       transform="translate(13.006636,7.4323632)"><tspan
         x="53.884766"
         y="116.37887"
         id="tspan7">Linux Install Party 2026</tspan></text><text
       xml:space="preserve"
       id="text6"
       style="font-size:32px;line-height:1.75;font-family:Monospace;-inkscape-font-specification:Monospace;white-space:pre;shape-inside:url(#rect6);display:inline;fill:#f8f8f8;fill-opacity:1"
       transform="translate(-6.0344191,-7.9331493)"><tspan
         x="74.324219"
         y="223.98047"
         id="tspan9">1. Descargar ISO: http://installparty.local/
</tspan><tspan
         x="74.324219"
         y="279.98047"
         id="tspan10">2. Descargar Rufus: https://rufus.ie/ -&gt; Download -&gt; Portable Windows x64
</tspan><tspan
         x="74.324219"
         y="335.98047"
         id="tspan11">3. Enchufar pincho -&gt; Abrir Rufus -&gt; Seleccionar ISO -&gt; Seleccionar pincho -&gt; Escribir
</tspan><tspan
         x="74.324219"
         y="391.98047"
         id="tspan12">3.5. Si deseas conservar Windows, entra al admin. de dispositivos y reduce la partición de </tspan><tspan
         x="74.324219"
         y="447.98047"
         id="tspan13">windows. 
</tspan><tspan
         x="74.324219"
         y="503.98047"
         id="tspan14">4. Reiniciar (con el pincho puesto) y durante el arranque, pulsar F2, F12 o Suprimir </tspan><tspan
         x="74.324219"
         y="559.98047"
         id="tspan15">repetidamente.
</tspan><tspan
         x="74.324219"
         y="615.98047"
         id="tspan16">5. En el menú, seleccionar menú de arranque o boot, y seleccionar el pincho
</tspan><tspan
         x="74.324219"
         y="671.98047"
         id="tspan17">6. Sigue el proceso de instalación, seleccionando tu idioma... etc
</tspan><tspan
         x="74.324219"
         y="727.98047"
         id="tspan18">7. Utiliza la opción guiada de particionamiento, borra la partición de Windows si lo deseas
</tspan><tspan
         x="74.324219"
         y="783.98047"
         id="tspan19">8. Disfrutar :D</tspan></text><text
       xml:space="preserve"
       id="text7"
       style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:53.3333px;line-height:1.25;font-family:Monospace;-inkscape-font-specification:'Monospace Bold';white-space:pre;shape-inside:url(#rect8);fill:#f8f8f8;fill-opacity:1"
       transform="translate(424.93924,14.384842)"><tspan
         x="471.95508"
         y="823.86911"
         id="tspan20">Si tienes dudas, pregunta!</tspan></text><rect
       style="fill:none;fill-opacity:1;stroke:#f8f8f8;stroke-width:5;stroke-dasharray:none;stroke-opacity:1"
